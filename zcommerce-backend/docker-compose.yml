name: zcommerce

x-api-env: &api-env
  NODE_ENV: production
  PORT: 4000
  APP_URL: ${APP_URL:-http://localhost:4000}
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/zcommerce
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-encryption-key}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3001}
  STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:3001}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-zCommerce <no-reply@zcommerce.test>}

services:
  api:
    build: .
    environment: *api-env
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run migrations on boot; seed manually with: docker compose exec api npx knex seed:run
    command: sh -c "npx knex --knexfile knexfile.js migrate:latest && node src/server.js"
    restart: unless-stopped

  worker:
    build: .
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "src/jobs/workers/index.js"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zcommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zcommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  uploads:
